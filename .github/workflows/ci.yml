name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci:quality
      - run: pnpm run ci:prod:extras

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run security:audit

  ci:
    if: ${{ always() }}
    needs: [quality, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to succeed
        env:
          FA_QUALITY_RESULT: ${{ needs.quality.result }}
          FA_AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          test "$FA_QUALITY_RESULT" = success
          test "$FA_AUDIT_RESULT" = success
