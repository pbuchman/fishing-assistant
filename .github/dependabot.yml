version: 2
updates:
  # Dependabot applies a three-day release-age cooldown. Exact reviewed bootstrap
  # exceptions for installed bootstrap packages live in pnpm-workspace.yaml.
  # Fresh-cache recursive resolution verifies them; future versions keep the cooldown.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 10
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Warsaw
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ['*']
