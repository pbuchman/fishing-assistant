<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7fb" />
    <title>Fishing Assistant offline</title>
    <style>
      :root {
        color: #1f1f1f;
        background: #f4f7fb;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 520px);
        border: 1px solid #dfe3ea;
        border-radius: 24px;
        padding: 24px;
        background: #fff;
        box-shadow: 0 18px 50px rgba(60, 64, 67, 0.12);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 1.45rem;
      }

      p {
        margin: 0;
        color: #5f6368;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Jesteś offline</h1>
      <p>Połącz się z internetem, żeby używać asystenta i wczytać najnowszą wiedzę.</p>
    </main>
  </body>
</html>
